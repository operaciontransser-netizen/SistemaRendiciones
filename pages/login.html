<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Iniciar sesión | Rendiciones</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #f4f6f9;

      font-family:
        "Segoe UI",
        Arial,
        sans-serif;
    }


    .login-card {
      width: 100%;
      max-width: 430px;

      border: none;
      border-radius: 14px;

      box-shadow:
        0 8px 30px
        rgba(0, 0, 0, 0.08);
    }


    .titulo {
      color: #1f4e79;
      font-weight: 700;
    }


    .btn-login {
      background: #1f4e79;
      border-color: #1f4e79;
    }


    .btn-login:hover {
      background: #173c5e;
      border-color: #173c5e;
    }

  </style>
</head>


<body>


  <div class="card login-card">

    <div class="card-body p-5">


      <div class="text-center mb-4">

        <h2 class="titulo">
          Rendiciones
        </h2>

        <p class="text-muted mb-0">
          Sistema de revisión
        </p>

      </div>


      <form id="formLogin">


        <div class="mb-3">

          <label
            for="email"
            class="form-label"
          >
            Correo electrónico
          </label>


          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="usuario@empresa.cl"
            autocomplete="email"
            required
          >

        </div>


        <div
          id="mensajeLogin"
          class="alert d-none"
          role="alert"
        ></div>


        <button
          id="btnLogin"
          type="submit"
          class="btn btn-login text-white w-100"
        >
          Ingresar
        </button>


      </form>


    </div>

  </div>


  <!--
    IMPORTANTE:
    login.html está dentro de /pages
    login.js está dentro de /assets/js
  -->

  <script src="../assets/js/login.js"></script>


</body>

</html>
